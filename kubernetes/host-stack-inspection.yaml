apiVersion: v1
kind: Pod
metadata:
  name: host-stack-inspection
  namespace: gpu-operator
  labels:
    test: runai-host-stack-inspection
spec:
  hostPID: true
  hostNetwork: true
  automountServiceAccountToken: false
  restartPolicy: Never
  nodeSelector:
    workload: runai-fractioning
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: inspect
      image: public.ecr.aws/amazonlinux/amazonlinux:2023
      imagePullPolicy: IfNotPresent
      securityContext:
        privileged: true
      command: ["/bin/bash", "-lc"]
      args:
        - |
          set -euo pipefail
          echo "gpu:"
          chroot /host /usr/bin/nvidia-smi \
            --query-gpu=name,uuid,driver_version,memory.total \
            --format=csv,noheader
          echo "toolkit:"
          chroot /host /usr/bin/rpm -q nvidia-container-toolkit
          echo "containerd:"
          chroot /host /usr/bin/containerd --version
          echo "cgroup-filesystem:"
          chroot /host /usr/bin/stat -fc %T /sys/fs/cgroup
          echo "nri-sockets:"
          nri_found=0
          for socket in \
            /var/run/nri/nri.sock \
            /run/nri/nri.sock \
            /var/run/containerd/nri/nri.sock \
            /run/containerd/nri/nri.sock; do
            if chroot /host /usr/bin/test -S "${socket}"; then
              echo "${socket}"
              nri_found=1
            fi
          done
          if [[ "${nri_found}" -ne 1 ]]; then
            echo "no known NRI socket found" >&2
            exit 7
          fi
      volumeMounts:
        - name: host-root
          mountPath: /host
          readOnly: true
  volumes:
    - name: host-root
      hostPath:
        path: /
        type: Directory

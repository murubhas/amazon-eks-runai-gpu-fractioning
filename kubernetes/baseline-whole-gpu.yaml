apiVersion: v1
kind: Pod
metadata:
  name: whole-gpu-a
  namespace: runai-fractioning-test
  labels:
    test: whole-gpu-baseline
spec:
  runtimeClassName: nvidia
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    workload: runai-fractioning
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: gpu-workload
      image: nvcr.io/nvidia/cuda:12.4.1-base-ubuntu22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - nvidia-smi --query-gpu=name,uuid,memory.total --format=csv,noheader && sleep 1800
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
          nvidia.com/gpu: "1"
        limits:
          cpu: "1"
          memory: 512Mi
          nvidia.com/gpu: "1"
---

apiVersion: v1
kind: Pod
metadata:
  name: fraction-8gi-over-limit
  namespace: runai-fractioning-test
  labels:
    kai.scheduler/queue: default-queue
    test: runai-fractioning-negative
  annotations:
    nvidia.com/container.gpu-workload.gpu-memory.request: 8Gi
    nvidia.com/container.gpu-workload.gpu-memory.limit: 8Gi
spec:
  schedulerName: kai-scheduler
  runtimeClassName: nvidia
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 5
  nodeSelector:
    workload: runai-fractioning
  tolerations:
    - key: nvidia.com/gpu
      operator: Exists
      effect: NoSchedule
  containers:
    - name: gpu-workload
      image: nvcr.io/nvidia/cuda:12.4.1-devel-ubuntu22.04
      imagePullPolicy: IfNotPresent
      command: ["/bin/bash", "-lc"]
      args:
        - nvidia-smi --query-gpu=uuid,name,memory.total --format=csv,noheader && nvcc -O2 /probe/probe.cu -o /tmp/probe && exec /tmp/probe 9216 0 1
      resources:
        requests:
          cpu: 500m
          memory: 512Mi
          ephemeral-storage: 1Gi
        limits:
          cpu: 1500m
          memory: 2Gi
          ephemeral-storage: 6Gi
      volumeMounts:
        - name: probe
          mountPath: /probe
          readOnly: true
  volumes:
    - name: probe
      configMap:
        name: cuda-memory-probe
